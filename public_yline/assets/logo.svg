<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroui-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
    <style>
      @keyframes pulsePulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.04); opacity: 0.85; }
      }
      @keyframes radarSweep {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 60; }
      }
      .pulse-ring {
        animation: pulsePulse 3s ease-in-out infinite;
        transform-origin: center;
      }
      .signal-line {
        stroke-dasharray: 6 3;
        animation: radarSweep 2s linear infinite;
      }
    </style>
  </defs>

  <!-- Ambient Glow Behind -->
  <circle cx="24" cy="24" r="18" fill="#6366F1" opacity="0.18" filter="url(#glow-filter)" />

  <!-- Obsidian Squircle Base -->
  <rect x="4" y="4" width="40" height="40" rx="12" fill="#09090D" stroke="url(#heroui-grad)" stroke-width="2" class="pulse-ring" />

  <!-- CI/CD Diagnostic Wave / Pipeline Pulse -->
  <path d="M12 24H18L21 16L27 32L30 24H36" stroke="url(#neon-cyan)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="signal-line" filter="url(#glow-filter)"/>

  <!-- Live Pulse Diagnostic Indicator Dot -->
  <circle cx="36" cy="24" r="2.5" fill="#38BDF8">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
  </circle>
</svg>
